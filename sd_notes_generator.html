<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Note Generator</title>
  <button type="button" id="clearBtn" onclick="clearForm()">Clear</button>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0056b3;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-orange { background-color: #f0ad4e; }
    .btn-green { background-color: #5cb85c; }
    .btn-blue { background-color: #007bff; width: 100%; }
    .btn:hover { opacity: 0.9; }
    textarea {
      height: 100px;
      background-color: #eef2f5;
      resize: vertical;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>SD Note Generator</h2>

    <div class="form-group">
      <label for="customerName">Customer Name:</label>
      <input type="text" id="customerName" placeholder="Ron Martinez">
    </div>

    <div class="form-group">
      <label for="unitAppliance">Unit/Appliance:</label>
      <input type="text" id="unitAppliance" placeholder="Whirlpool washer">
    </div>

    <div class="form-group">
      <label for="partsOrdered">Parts Ordered:</label>
      <input type="text" id="partsOrdered" placeholder="compressor">
    </div>

    <div class="form-group">
      <label for="partsEta">Parts ETA:</label>
      <input type="date" id="partsEta">
    </div>

    <div class="form-group">
      <label for="customerAddress">Customer Address:</label>
      <input type="text" id="customerAddress" placeholder="1st Street Silver Hill Subdivision, Luna">
    </div>

    <div class="form-group">
      <label for="appointmentDate">Appointment Date:</label>
      <input type="date" id="appointmentDate">
    </div>

    <div class="form-group">
      <label for="timeSlot">Timeslot:</label>
      <select id="timeSlot">
        <option value="">Select a timeslot</option>
        <option value="8am - 12pm">8am - 12pm</option>
        <option value="12pm - 4pm">12pm - 4pm</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="btn btn-orange" onclick="generateNote('voicemail')">Voicemail Template</button>
      <button class="btn btn-green" onclick="generateNote('spoke')">Spoke to Customer</button>
    </div>

    <div class="form-group">
      <textarea id="noteOutput" placeholder="Your generated note will appear here..." readonly></textarea>
    </div>

    <button class="btn btn-blue" onclick="copyNote()">Copy to Clipboard</button>
  </div>

  <script>
    // Helper function to turn "YYYY-MM-DD" into "MM/DD/YYYY"
    function formatDate(dateString) {
      if (!dateString) return '';
      const [year, month, day] = dateString.split('-');
      return `${month}/${day}/${year}`;
    }

    function generateNote(type) {
      const name = document.getElementById('customerName').value;
      const appliance = document.getElementById('unitAppliance').value;
      const parts = document.getElementById('partsOrdered').value;
      const eta = formatDate(document.getElementById('partsEta').value);
      const address = document.getElementById('customerAddress').value;
      const apptDate = formatDate(document.getElementById('appointmentDate').value);
      const timeslot = document.getElementById('timeSlot').value;

      let note = '';

      if (type === 'voicemail') {
        note = `Left voicemail for ${name || 'Customer'}.\n` +
               `Appliance: ${appliance}\n` +
               `Parts Ordered: ${parts} (ETA: ${eta})\n` +
               `Address: ${address}\n` +
               `Appointment: ${apptDate} ${timeslot ? '(' + timeslot + ')' : ''}`;
      } else if (type === 'spoke') {
        note = `Spoke with ${name || 'Customer'}.\n` +
               `Confirmed appointment for ${appliance} on ${apptDate} [${timeslot}].\n` +
               `Pre-ID Parts (${parts}) expected ETA: ${eta}.\n` +
               `Address: ${address}`;
      }

      document.getElementById('noteOutput').value = note;
    }

    function copyNote() {
      const output = document.getElementById('noteOutput');
      if (output.value) {
        navigator.clipboard.writeText(output.value);
        alert('Note copied to clipboard!');
      }
    }
  </script>

</body>
</html>
